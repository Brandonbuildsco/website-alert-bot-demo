# Checks the watched pages every 30 minutes on GitHub's servers.
# "Run workflow" (Actions tab) runs it right away.
name: Website change alerts

on:
  schedule:
    - cron: "7,37 * * * *"      # every 30 minutes (GitHub may start late on busy days)
  workflow_dispatch:

permissions:
  contents: write                # save state.json (what the bot saw last time)
  issues: write                  # open a GitHub Issue as the alert

concurrency:
  group: watch                   # never run two checks at once
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests first (stop if anything is broken)
        run: python -m pytest -q

      - name: Check pages and send alerts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # built in: used to open alert Issues
          # Optional extra channels - only used if you add these repository secrets:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python watch.py

      - name: Save what the bot saw
        if: always()               # save progress even if one page failed
        run: |
          git config user.name "alert-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update watch state"
          git push

      - name: Keep the log for 14 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watch-log
          path: logs/
          retention-days: 14
